[project]
name = "mnist-portfolio-project"
version = "0.1.0"
description = "Self-directed MNIST handwritten digit classification portfolio project"
authors = [{ name = "AnomInsight" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "tensorflow>=2.12.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "idx2numpy>=1.2.3",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

